<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingles 6to</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/shared.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
  <header>
    <div class="top">
      <div class="brand-area">
        <a href="../index.html" class="back-btn"><i data-lucide="arrow-left"></i></a>
        <div class="brand-icon" style="background: linear-gradient(135deg, #ec4899, #f472b6);">
          <i data-lucide="languages"></i>
        </div>
        <div><div class="brand">Ingles</div><div class="sub">6to Grado</div></div>
      </div>
    </div>
  </header>
  <main class="wrap">
    <section id="setup" class="setup">
      <div class="setup-hero">
        <i data-lucide="languages" class="hero-icon" style="color: #ec4899;"></i>
        <h1>Ingles 6to</h1>
        <p>Verbos, vocabulario, gramatica y comprension</p>
      </div>
      <div class="grid">
        <div class="field">
          <label><i data-lucide="tag"></i> Tema</label>
          <select id="topic">
            <option value="all">Todos</option>
            <option value="Verbos">Verbos</option>
            <option value="Vocabulario">Vocabulario</option>
            <option value="Gramatica">Gramatica</option>
            <option value="Comprension">Comprension</option>
            <option value="Ortografia">Ortografia</option>
          </select>
        </div>
        <div class="field">
          <label><i data-lucide="layers"></i> Cantidad</label>
          <select id="amount"><option value="10">10</option><option value="20" selected>20</option><option value="30">30</option><option value="50">50</option></select>
        </div>
        <div class="field">
          <label><i data-lucide="timer"></i> Tiempo</label>
          <select id="time"><option value="0">Sin limite</option><option value="15">15 min</option><option value="25" selected>25 min</option><option value="40">40 min</option></select>
        </div>
      </div>
      <button class="primary btn-start" onclick="startExam()"><i data-lucide="play-circle"></i> Comenzar</button>
    </section>
    <section id="exam" class="exam"><div class="exam-card">
      <div class="exam-top"><div class="q-counter" id="counter"><span class="q-num">1</span><span class="q-total">/ 20</span></div><div class="timer-badge" id="timer"><i data-lucide="clock"></i> <span>Sin limite</span></div></div>
      <div class="progress-wrap"><div class="progress"><div class="bar" id="bar"></div></div><span class="progress-pct" id="progressPct">0%</span></div>
      <div class="question-area"><p class="question" id="question"></p></div>
      <div class="options" id="options"></div>
      <div class="exam-bottom"><span class="answered" id="answeredText">0 respondidas</span><div style="display:flex;gap:8px"><button class="btn-pdf" onclick="exportPDF()" title="Descargar PDF para imprimir"><i data-lucide="download"></i> PDF</button><button class="primary btn-finish" id="finishBtn" onclick="finish()" style="display:none"><i data-lucide="check-circle"></i> Finalizar</button></div></div>
    </div></section>
    <section id="result" class="result"><div class="result-card">
      <div class="result-hero"><i data-lucide="trophy" class="trophy"></i><h1>Completado</h1></div>
      <div class="score-circle"><span class="score-big" id="score">0/20</span><span class="score-pct" id="scorePct">0%</span></div>
      <p class="result-msg" id="resultText"></p>
      <div class="review" id="review"></div>
      <button class="primary btn-large" onclick="showSetup()"><i data-lucide="rotate-ccw"></i> Volver</button>
    </div></section>
  </main>
  <script src="../js/shared.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
